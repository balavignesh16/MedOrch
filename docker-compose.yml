version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  gateway:
    build: ./gateway
    ports:
      - "50051:50051"
    environment:
      - ENV=production

  engine:
    build: ./engine
    ports:
      - "50052:50052"
    environment:
      - ENV=production
      - DB_USER=medorch
      - DB_PASSWORD=medorchpass
      - DB_NAME=medorch_db
      - DB_HOST=db

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=medorch
      - POSTGRES_PASSWORD=medorchpass
      - POSTGRES_DB=medorch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
