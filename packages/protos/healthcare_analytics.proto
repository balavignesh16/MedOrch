syntax = "proto3";

package healthcare.analytics.v1;

option go_package = "github.com/medorch/gateway/gen/healthcare/analytics/v1;analyticsv1";

// -----------------------------------------------------------------------------
// Service Definition
// -----------------------------------------------------------------------------

service AnalyticsEngine {
  // Processes a natural language query and returns actionable insights.
  rpc ProcessQuery(QueryRequest) returns (InsightResponse);
}

// -----------------------------------------------------------------------------
// Messages
// -----------------------------------------------------------------------------

// Request payload sent from Go Gateway to Python AI Engine
message QueryRequest {
  // Unique identifier for tracking/tracing the request
  string request_id = 1;
  
  // The natural language prompt from the hospital administrator
  string prompt = 2;
  
  // Authenticated user's metadata for auditing and RBAC
  AuthMetadata auth_metadata = 3;
}

message AuthMetadata {
  string user_id = 1;
  string role = 2;
  string department_id = 3;
}

// Response payload sent back to Go Gateway
message InsightResponse {
  // Unique identifier matching the request
  string request_id = 1;
  
  // Textual insights generated by the AI Engine
  string textual_summary = 2;
  
  // Structured numerical data for UI charts (D3/Recharts)
  // Kept generic to allow flexible JSON payloads mapped to UI props
  string chart_data_json = 3; 
  
  // Array of medical citations found via Qdrant RAG
  repeated Citation citations = 4;
  
  // Flags whether the GRC Node redacted or altered data
  bool grc_scrubbed = 5;
}

message Citation {
  string source_id = 1;
  string title = 2;
  string abstract = 3;
  string url = 4;
  float relevance_score = 5;
}
